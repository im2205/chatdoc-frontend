version: "3.9"

services:
  frontend:
    container_name: chatdoc-frontend
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  chatdoc-common:
    external: true
    name: chatdoc-common